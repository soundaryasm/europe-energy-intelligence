    domain: "10Y1001A1001A59C"  # Ireland (SEM) bidding zone
    validated: false

  - country_code: DE
    domain: "10Y1001A1001A82H"  # Germany-Luxembourg (DE-LU) bidding zone
    validated: false

  - country_code: FR
    domain: "10YFR-RTE------C"
    validated: false

  - country_code: ES
    domain: "10YES-REE------0"
    validated: false

  - country_code: NL
    domain: "10YNL----------L"
    validated: false
