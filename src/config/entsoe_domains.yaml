# ENTSO-E bidding-zone/domain (EIC) codes for the MVP countries (Spec 002).
#
# SOURCE: publicly documented ENTSO-E Transparency Platform domain codes.
# STATUS: every domain below has been empirically confirmed — either
# through extensive real production ingestion this project (IE/DE/FR/ES/NL,
# validated via repeated real Bronze ingestion/reprocessing runs against
# live ENTSO-E), or through a dedicated historical coverage probe
# (BE/PT/PL/CZ/FI/HU/RO/SK/SI/EE, run 2026-09-06 against real dates
# 2015-01-05 through 2026-06-15 for all three datasets — 313/315 checks
# returned real data; see project memory for the full coverage matrix).
#
# Spec 002: "Codes must be validated against ENTSO-E before being
# committed to production configuration." Every entry below is
# `validated: true`; a `validated: false` entry would be an open
# blocker, not a soft warning.
#
# IRELAND: the SEM code below serves price and generation but NOT load.
# Irish load is published only under the EirGrid control area
# 10YIE-1001A00010 (verified live 2026-11-01). The "validated via
# repeated real Bronze ingestion" claim above was therefore never true
# for IE load — that combination had zero rows and the gap was read as
# an upstream absence for a year. Ireland is reached through
# `src/config/entsoe.ALTERNATIVE_DOMAINS`, consulted by both the daily
# pipeline and the historical walk when the code below returns nothing.
#
# ZONE CHANGES: every domain below is the one its country uses now.
# Where a country has changed bidding zone, the domain here holds
# nothing for the years before the change, and ENTSO-E answers such a
# request with a clean "no matching data" rather than an error.
#
# Germany is the case in hand: the domain below (DE-LU) is only correct
# from 2018-10-01 onward, and before that Germany was part of the
# combined DE-AT-LU zone (EIC 10Y1001A1001A63L). Verified against live
# ENTSO-E on 2026-10-31, including the handover falling mid-day on
# 2018-09-30.
#
# This schema is deliberately not effective-dated. Second codes live in
# `src/config/entsoe.ALTERNATIVE_DOMAINS`, tried only when a request
# under the code here came back with nothing
# — so no switchover date is encoded anywhere, and nothing here can
# fall out of step with what ENTSO-E serves. Only historical ingestion
# needs this; the daily pipeline never requests dates that old.
domains:
  - country_code: IE
    domain: "10Y1001A1001A59C"  # Ireland (SEM) bidding zone
    validated: true

  - country_code: DE
    domain: "10Y1001A1001A82H"  # Germany-Luxembourg (DE-LU) bidding zone, valid from 2018-10-01
    validated: true

  - country_code: FR
    domain: "10YFR-RTE------C"
    validated: true

  - country_code: ES
    domain: "10YES-REE------0"
    validated: true

  - country_code: NL
    domain: "10YNL----------L"
    validated: true

  - country_code: BE
    domain: "10YBE----------2"
    validated: true

  - country_code: PT
    domain: "10YPT-REN------W"
    validated: true

  - country_code: PL
    domain: "10YPL-AREA-----S"
    validated: true

  - country_code: CZ
    domain: "10YCZ-CEPS-----N"
    validated: true

  - country_code: FI
    domain: "10YFI-1--------U"
    validated: true

  - country_code: HU
    domain: "10YHU-MAVIR----U"
    validated: true

  - country_code: RO
    domain: "10YRO-TEL------P"
    validated: true

  - country_code: SK
    domain: "10YSK-SEPS-----K"
    validated: true

  - country_code: SI
    domain: "10YSI-ELES-----O"
    validated: true

  - country_code: EE
    domain: "10Y1001A1001A39I"
    validated: true
