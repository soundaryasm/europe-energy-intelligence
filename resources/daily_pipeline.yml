# Daily pipeline job definition (Spec 006).
#
# NOT VALIDATED against a real Databricks workspace — see databricks.yml
# header. Task DAG, schedule, and retry policy follow
# specs/006-daily-orchestration.md; review the `warehouse_id` variable
# and notebook paths before deploying.

variables:
  sql_warehouse_id:
    description: "Databricks SQL Warehouse ID used by the build_dbt_gold task."
  postgres_secret_scope:
    description: "Databricks secret scope holding PostgreSQL credentials."
    default: europe-energy-intelligence
  entsoe_secret_scope:
    description: "Databricks secret scope holding the ENTSO-E API token."
    default: europe-energy-intelligence

resources:
  jobs:
    europe_energy_intelligence_daily:
      name: "European Energy Intelligence - Daily Pipeline"

      # Run once daily at 02:00 UTC, by explicit choice (2026-09-08) —
      # every pipeline in this project uses UTC, not local time, even
      # though this one previously used Europe/Dublin deliberately so
      # it always fired "2 hours after local midnight" for Silver's
      # local-calendar-date grain. Trade-off accepted: with fixed UTC,
      # that local alignment now drifts by an hour between Irish DST
      # and standard time (02:00 UTC = 03:00 Dublin in summer, 02:00
      # Dublin in winter) instead of staying fixed at 2 hours past
      # local midnight year-round.
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

      # A scheduled run always uses execution_mode=daily (Spec 006: "The
      # scheduled daily workflow must not accidentally trigger a full
      # 24-month backfill."). Backfill/reprocess runs are triggered
      # manually with these parameters overridden. This is the single
      # canonical processing-window definition (Spec 006 "Canonical
      # Processing Window") passed to every task that needs it, rather
      # than each task calculating its own date range.
      parameters:
        - name: execution_mode
          default: "daily"
        - name: start_date
          default: ""
        - name: end_date
          default: ""
        - name: lookback_days
          default: "3"

      # Every Python notebook task below runs on this one, explicit,
      # serverless environment (Standard v5 / Python 3.12 — matches what
      # the interactive notebook is confirmed to run on) instead of
      # depending on whatever compute a user last selected in the
      # notebook's Environment panel. Dependencies are read live from the
      # deployed requirements.txt so the two can never drift apart.
      environments:
        - environment_key: python_notebook_env
          spec:
            environment_version: "5"
            dependencies:
              - -r ${workspace.file_path}/requirements.txt
        # Separate from python_notebook_env rather than adding
        # dbt-databricks to the shared one: it pulls in its own large
        # dependency set (dbt-core, jinja2, etc.) that only build_dbt_gold
        # needs, and a serverless task's `libraries` field is rejected at
        # submit time ("Libraries field is not supported for serverless
        # task, please specify libraries in environment") — confirmed via
        # a real one-time run — so this can't just be a task-level
        # `libraries: [...]` entry either.
        - environment_key: dbt_env
          spec:
            environment_version: "5"
            dependencies:
              - dbt-databricks==1.8.5

      tasks:
        - task_key: ingest_open_meteo
          environment_key: python_notebook_env
          notebook_task:
            notebook_path: "${workspace.file_path}/notebooks/ingestion/open_meteo_ingestion"
            base_parameters:
              execution_mode: "{{job.parameters.execution_mode}}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
              lookback_days: "{{job.parameters.lookback_days}}"
          timeout_seconds: 3600
          max_retries: 2
          min_retry_interval_millis: 300000 # 5 minutes
          retry_on_timeout: true

        - task_key: ingest_entsoe
          environment_key: python_notebook_env
          notebook_task:
            notebook_path: "${workspace.file_path}/notebooks/ingestion/entsoe_ingestion"
            base_parameters:
              execution_mode: "{{job.parameters.execution_mode}}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
              lookback_days: "{{job.parameters.lookback_days}}"
              secret_scope: "${var.entsoe_secret_scope}"
              secret_key: "ENTSOE_API_TOKEN"
          timeout_seconds: 3600
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        # World Bank is intentionally independent of everything else in
        # this DAG: no date-range parameters (it always fetches whatever
        # year is currently current — see worldbank_ingestion.py), no
        # secret (no API key required), and no downstream dependents —
        # Silver/Gold/Postgres do not consume it yet. It runs in
        # parallel with the other two ingestion tasks purely to land in
        # Bronze daily; a failure here must not block ENTSO-E/Open-Meteo
        # reaching Silver/Gold/Postgres, so nothing downstream depends
        # on it.
        - task_key: ingest_worldbank
          environment_key: python_notebook_env
          notebook_task:
            notebook_path: "${workspace.file_path}/notebooks/ingestion/worldbank_ingestion"
          timeout_seconds: 1800
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

        # Silver must not start until BOTH ingestion tasks succeed
        # (implicit ALL_SUCCESS run_if — Spec 006 "Failure Behaviour").
        - task_key: transform_silver
          environment_key: python_notebook_env
          depends_on:
            - task_key: ingest_open_meteo
            - task_key: ingest_entsoe
          notebook_task:
            notebook_path: "${workspace.file_path}/notebooks/transformations/transform_silver"
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 300000

        # dbt must not run until Silver succeeds.
        - task_key: build_dbt_gold
          environment_key: dbt_env
          depends_on:
            - task_key: transform_silver
          dbt_task:
            project_directory: "${workspace.file_path}/dbt"
            # Explicit, not left to default: the dbt_task type defaults
            # catalog to the workspace default and schema to `default`
            # when unset — Gold must land in workspace.gold specifically,
            # since publish_postgres reads from gold_catalog=workspace.gold.
            catalog: "workspace"
            schema: "gold"
            commands:
              - "dbt deps"
              - "dbt seed"
              - "dbt run"
              - "dbt test"
            warehouse_id: "${var.sql_warehouse_id}"
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 300000

        # Spec 007 data-quality gate: publish only runs if dbt (and its
        # tests) succeeded — a failed/known-invalid Gold build never
        # reaches the serving layer.
        - task_key: publish_postgres
          environment_key: python_notebook_env
          depends_on:
            - task_key: build_dbt_gold
          notebook_task:
            notebook_path: "${workspace.file_path}/notebooks/serving/publish_postgres"
            base_parameters:
              gold_catalog: "workspace.gold" # matches the validated Gold location (Unity Catalog "workspace" catalog, "gold" schema)
              secret_scope: "${var.postgres_secret_scope}"
          timeout_seconds: 1800
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true

      email_notifications: {}
