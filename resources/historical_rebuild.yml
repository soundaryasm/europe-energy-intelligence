# Historical Silver/Gold rebuild job definition (Spec 010).
#
# Rebuilds Silver and Gold over the full historical range and
# republishes the serving layer. Reads Bronze and nothing else, so it
# assumes the historical Bronze load has already run and verified
# (historical_bronze_load.yml).
#
# Deliberately not chained to that job. Its verify task reports what
# reached Bronze, and that output is meant to be read by a person before
# this job is started — a decade of Silver plus a full dbt build is the
# most expensive run in the project, and starting it on a Bronze that is
# short of a year wastes all of it.
#
# No schedule: run once, by hand. Safe to re-run — Silver and Gold are
# rebuilt from Bronze on every run regardless of what they held before.
#
# Before the first run, `dim_date` must cover the full historical range,
# or fact rows will have no matching dimension row and the Gold
# relationship tests will fail.

variables:
  sql_warehouse_id:
    description: "Databricks SQL Warehouse ID used by the build_dbt_gold task."
  postgres_secret_scope:
    description: "Databricks secret scope holding PostgreSQL credentials."
    default: europe-energy-intelligence

resources:
  jobs:
    europe_energy_intelligence_historical_rebuild:
      name: "European Energy Intelligence - Historical Silver/Gold Rebuild"

      # Silver and the serving publish are windowed (Spec 006 canonical
      # processing window): the daily job passes a 3-day `daily` window,
      # and this job passes the whole history explicitly. `reprocess`
      # requires both dates, deliberately — a defaulted range is exactly
      # the thing that gets run by accident against the wrong window.
      #
      # `end_date` is the last date the historical blob layer covers
      # plus the days the daily pipeline has since ingested. Override it
      # at run time rather than editing this file:
      #   --params end_date=YYYY-MM-DD
      parameters:
        - name: execution_mode
          default: "reprocess"
        - name: start_date
          default: "2015-01-01"
        - name: end_date
          default: ""
        - name: lookback_days
          default: "3"

      environments:
        - environment_key: python_notebook_env
          spec:
            environment_version: "5"
            dependencies:
              - -r ${workspace.file_path}/requirements.txt
        # Separate from python_notebook_env rather than adding
        # dbt-databricks to the shared one: it pulls in its own large
        # dependency set (dbt-core, jinja2, etc.) that only build_dbt_gold
        # needs, and a serverless task's `libraries` field is rejected at
        # submit time ("Libraries field is not supported for serverless
        # task, please specify libraries in environment") — confirmed via
        # a real one-time run — so this can't just be a task-level
        # `libraries: [...]` entry either.
        - environment_key: dbt_env
          spec:
            environment_version: "5"
            dependencies:
              - dbt-databricks==1.8.5

      # Hard ceiling on the whole rebuild. The longest this job has ever
      # taken is 5.3 minutes, over the full 2015-2026 history (2026-11-04).
      # 90 minutes is ~17x that - generous, because a legitimate slow run
      # here is rare and expensive to lose - while still bounding a hang,
      # which previously could stack 8 hours against the Free Edition
      # allowance with nothing to stop it.
      timeout_seconds: 5400

      tasks:
        - task_key: transform_silver
          environment_key: python_notebook_env
          notebook_task:
            notebook_path: "${workspace.file_path}/notebooks/transformations/transform_silver"
            base_parameters:
              # See the notebook's own sys.path bootstrap comment for why.
              bundle_root: "${workspace.file_path}"
              execution_mode: "{{job.parameters.execution_mode}}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
              lookback_days: "{{job.parameters.lookback_days}}"
          timeout_seconds: 2700

        - task_key: build_dbt_gold
          environment_key: dbt_env
          depends_on:
            - task_key: transform_silver
          dbt_task:
            project_directory: "${workspace.file_path}/dbt"
            # Explicit, not left to default: the dbt_task type defaults
            # catalog to the workspace default and schema to `default`
            # when unset — Gold must land in workspace.gold specifically,
            # since publish_postgres reads from gold_catalog=workspace.gold.
            catalog: "workspace"
            schema: "gold"
            commands:
              - "dbt deps"
              - "dbt seed"
              - "dbt run"
              - "dbt test"
            warehouse_id: "${var.sql_warehouse_id}"
          timeout_seconds: 2700

        # Spec 007 data-quality gate: publish only runs if dbt (and its
        # tests) succeeded — a failed/known-invalid Gold build never
        # reaches the serving layer.
        - task_key: publish_postgres
          environment_key: python_notebook_env
          depends_on:
            - task_key: build_dbt_gold
          notebook_task:
            notebook_path: "${workspace.file_path}/notebooks/serving/publish_postgres"
            base_parameters:
              gold_catalog: "workspace.gold" # matches the validated Gold location (Unity Catalog "workspace" catalog, "gold" schema)
              secret_scope: "${var.postgres_secret_scope}"
              bundle_root: "${workspace.file_path}"
              execution_mode: "{{job.parameters.execution_mode}}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
              lookback_days: "{{job.parameters.lookback_days}}"
          timeout_seconds: 1800

      email_notifications: {}
