# Historical ingestion into blob storage (Spec 010).
#
# Each run resolves one year and exits, walking backwards from the last
# complete month to January 2015. Repetition comes from an external
# scheduler; a run that finds nothing left to resolve exits immediately,
# so a schedule left in place costs one short no-op per fire once the
# history is complete.
#
# Dispatch only, deliberately — there is no `schedule:` here. GitHub
# runs scheduled workflows on a best-effort basis and drops them
# outright under load, with no record of a dropped fire. Measured on
# 2026-10-18: of eight fires due across the day, two were delivered, 28
# and 58 minutes late, and moving off the top of the hour changed
# nothing. A walk that needs a dozen or so invocations to finish cannot
# be driven by a trigger that silently skips most of them.
#
# Invocations are instead dispatched by a Supabase cron job calling the
# workflow_dispatch API, which fires reliably. Adding `schedule:` back
# alongside it would double-trigger.
name: Historical backfill

on:
  workflow_dispatch:

# ENTSO-E rate-limits per token as well as per IP, and this workflow
# holds the only token. Two runs fetching at once would share that
# budget and risk the 10-minute ban that follows exceeding it, so runs
# are serialised rather than queued-and-overlapped.
concurrency:
  group: historical-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-year:
    runs-on: ubuntu-latest
    # Above the worst-case year, below the 6-hour default: a hung run
    # should die rather than consume the monthly minute allowance.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The ingestion modules and the Parquet writer only; the Spark and
      # dbt dependencies in requirements.txt are not needed here and are
      # not installed.
      - name: Install dependencies
        run: pip install requests pyyaml tenacity pyarrow boto3

      - name: Resolve one year
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          # Exchanged inside the store for short-lived S3 credentials,
          # re-minted as the run proceeds.
          UPSTASH_BLOB_TOKEN: ${{ secrets.UPSTASH_BLOB_TOKEN }}
        run: python scripts/run_blob_backfill.py
