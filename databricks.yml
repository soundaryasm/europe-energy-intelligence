# Databricks Asset Bundle root config (Spec 006).
#
# NOT VALIDATED: no Databricks CLI or workspace is available in this
# environment, so `databricks bundle validate` / `databricks bundle
# deploy` have not been run against this file. Review and validate
# before first deployment — see specs/006-daily-orchestration.md and the
# project status notes for what still needs a real Databricks workspace.

bundle:
  name: europe-energy-intelligence

include:
  - resources/*.yml

targets:
  prod:
    default: true
    # `workspace.host` intentionally omitted here — supply it via the
    # Databricks CLI profile/auth configuration, never hard-coded.
    mode: production
