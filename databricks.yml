# Databricks Asset Bundle root config (Spec 006).
#
# `databricks bundle validate` passes against this file (prod target).
# `databricks bundle deploy` has not been run yet — see
# specs/006-daily-orchestration.md and the project status notes before
# first deployment.

bundle:
  name: europe-energy-intelligence

include:
  - resources/*.yml

targets:
  prod:
    default: true
    # `workspace.host` intentionally omitted here — supply it via the
    # Databricks CLI profile/auth configuration, never hard-coded.
    mode: production
    workspace:
      # Required by `mode: production` so every deployer lands on the
      # same path regardless of who/what runs `databricks bundle deploy`.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      sql_warehouse_id: ed826545af6a5502
